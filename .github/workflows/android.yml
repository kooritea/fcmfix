name: Android CI

on:
  push:
    branches: [ "master", "merge-fcmfuck" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Retrieve version name
      run: echo VERSION_NAME=$(date "+%Y%m%d")_$(echo ${{ github.event.head_commit.id }} | head -c 7) >> $GITHUB_ENV

    - name: Retrieve version code
      run: echo VERSION_CODE=$(grep -Eo 'versionCode[[:space:]]+[0-9]+' ${{ github.workspace }}/app/build.gradle | grep -Eo '[0-9]+') >> $GITHUB_ENV

    - name: Set version name
      run: sed -i "s/versionName \".*\"/versionName \"${{ env.VERSION_NAME }}\"/" ${{ github.workspace }}/app/build.gradle

    - name: Build with Gradle
      run: ./gradlew assembleRelease --stacktrace

    - name: Setup build tool version variable
      shell: bash
      run: |
        BUILD_TOOL_VERSION=$(ls /usr/local/lib/android/sdk/build-tools/ 2>/dev/null | tail -n 1 || ls $ANDROID_HOME/build-tools/ 2>/dev/null | tail -n 1)
        echo "BUILD_TOOL_VERSION=$BUILD_TOOL_VERSION" >> $GITHUB_ENV
        echo Last build tool version is: $BUILD_TOOL_VERSION

    - name: Sign APK
      id: sign
      continue-on-error: true
      uses: r0adkll/sign-android-release@v1
      with:
        releaseDirectory: ${{ github.workspace }}/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNINGKEYBASE64 }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEYSTOREPASSWORD }}
        keyPassword: ${{ secrets.KEYPASSWORD }}
      env:
        BUILD_TOOLS_VERSION: ${{ env.BUILD_TOOL_VERSION }}

    - name: Prepare APK artifact (signed)
      if: steps.sign.outcome == 'success'
      run: mv ${{ github.workspace }}/app/build/outputs/apk/release/app-release-unsigned-signed.apk ${{ github.workspace }}/app/build/outputs/apk/release/fcmself-ci-${{ env.VERSION_NAME }}.apk

    - name: Prepare APK artifact (unsigned fallback)
      if: steps.sign.outcome != 'success'
      run: |
        echo "Signing skipped or failed; uploading unsigned APK"
        mv ${{ github.workspace }}/app/build/outputs/apk/release/app-release-unsigned.apk ${{ github.workspace }}/app/build/outputs/apk/release/fcmself-ci-${{ env.VERSION_NAME }}-unsigned.apk

    - name: Upload built apk
      uses: actions/upload-artifact@v4
      with:
        name: release
        path: ${{ github.workspace }}/app/build/outputs/apk/release/fcmself-ci-*.apk

    - name: Release
      if: github.ref == 'refs/heads/master'
      continue-on-error: true
      uses: softprops/action-gh-release@v2
      with:
        name: "Auto Release ${{ env.VERSION_NAME }}"
        tag_name: ${{ env.VERSION_CODE }}-${{ env.VERSION_NAME }}
        token: "${{ secrets.TOKEN }}"
        files: |
          ${{ github.workspace }}/app/build/outputs/apk/release/fcmself-ci-*.apk
