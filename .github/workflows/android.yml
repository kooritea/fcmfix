name: Android CI

on:
  # 手动触发：可以在任意分支上跑完整校验，不必先开 PR。
  workflow_dispatch:
  push:
    branches: [ "master", "merge-fcmfuck", "arena/**" ]
  pull_request:
    branches: [ "master" ]

# 同一分支上新的推送会取消尚未结束的旧任务，避免排队浪费额度。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      # 编译错误转成 GitHub 注解：CI 日志无法直接下载时，注解是唯一的失败定位渠道。
      - name: Annotate compile errors (unit tests)
        if: always()
        run: python3 scripts/annotate-gradle-errors.py gradle-test.log

      # 把失败的单元测试变成 GitHub 注解，不用下载日志压缩包就能看到原因。
      - name: Annotate unit test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import xml.etree.ElementTree as ET
          def escape(text):
              return (text or '').replace('%', '%25').replace('\\r', '%0D').replace('\\n', '%0A')
          for path in glob.glob('app/build/test-results/**/*.xml', recursive=True):
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  continue
              for case in root.iter('testcase'):
                  for problem in list(case.findall('failure')) + list(case.findall('error')):
                      title = f"{case.get('classname')}.{case.get('name')}"
                      message = escape(problem.get('message') or problem.text)
                      print(f"::error title=Unit test {title}::{message}")
          PY

      - name: Build release
        run: ./gradlew assembleRelease --stacktrace --warning-mode all 2>&1 | tee gradle-release.log

      - name: Annotate compile errors (release)
        if: always()
        run: python3 scripts/annotate-gradle-errors.py gradle-release.log

      - name: Run lint
        run: ./gradlew lint 2>&1 | tee gradle-lint.log

      - name: Annotate compile errors (lint)
        if: always()
        run: python3 scripts/annotate-gradle-errors.py gradle-lint.log

      # 测试与 lint 的 HTML/XML 报告，失败时排查用。
      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: |
            app/build/reports/**
            app/build/test-results/**
            gradle-*.log
          if-no-files-found: ignore

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
