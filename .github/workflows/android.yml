name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "master", "radical-simplify" ]
  pull_request:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Android SDK platforms
        uses: actions/cache@v5
        with:
          path: |
            /usr/local/lib/android/sdk/platforms
            /usr/local/lib/android/sdk/build-tools
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_SDK_ROOT }}/platforms
            ${{ env.ANDROID_SDK_ROOT }}/build-tools
          key: android-sdk-api37-v1-${{ runner.os }}
          restore-keys: |
            android-sdk-api37-v1-

      - name: Install Android platform and build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-37.0" "build-tools;37.0.0"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-$HOME/Android/Sdk}}"
          if [[ -d "$SDK_ROOT/platforms/android-37.0" ]]; then
            if [[ -L "$SDK_ROOT/platforms/android-37" ]]; then
              rm -f "$SDK_ROOT/platforms/android-37"
            fi
            if [[ ! -d "$SDK_ROOT/platforms/android-37" ]]; then
              mv "$SDK_ROOT/platforms/android-37.0" "$SDK_ROOT/platforms/android-37"
            fi
          fi
          test -f "$SDK_ROOT/platforms/android-37/android.jar"
          test -x "$SDK_ROOT/build-tools/37.0.0/aapt2"
          echo "sdk.dir=$SDK_ROOT" > local.properties
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release
        run: ./gradlew assembleRelease --stacktrace --no-daemon

      - name: Run lint
        run: ./gradlew lint --no-daemon

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: build-reports
          path: app/build/reports/**
          if-no-files-found: ignore

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
