plugins {
    id 'com.android.application'
}

android {
    namespace = 'sumicya.fcmself'
    compileSdk = 37

    defaultConfig {
        applicationId = "sumicya.fcmself"
        // Personal build on Android 16 only.
        minSdk = 36
        targetSdk = 37
        versionCode = 59
        versionName = "1.3.1"
        resConfigs "en", "zh", "zh-rCN"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            crunchPngs = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    lint {
        checkReleaseBuilds = true
        abortOnError = true
        textReport = true
        xmlReport = true
        warningsAsErrors = true
        // minSdk 36: all pre-Tiramisu SDK_INT branches are dead; keep lint quiet until fully cleaned.
        disable 'ObsoleteSdkInt'
    }

    packaging {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/*.kotlin_module",
                "kotlin/**"
            ]
        }
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all,-processing,-options,-path']
}

def lintBuildPath = layout.buildDirectory.get().asFile.absolutePath
tasks.register('annotateLintReports') {
    doLast {
        new File(lintBuildPath).eachFileRecurse { report ->
            if (!report.name.startsWith('lint-results') || !report.name.endsWith('.xml')) {
                return
            }
            new groovy.xml.XmlSlurper(false, false).parse(report).issue.each { issue ->
                def location = issue.location[0]
                def message = String.valueOf(issue.@message)
                        .replace('%', '%25')
                        .replace('\r', '%0D')
                        .replace('\n', '%0A')
                println "::error file=${location.@file},line=${location.@line},col=${location.@column},title=Android Lint ${issue.@id}::${message}"
            }
        }
    }
}
tasks.matching { it.name == 'lint' || it.name == 'lintDebug' || it.name == 'lintRelease' }.configureEach {
    finalizedBy('annotateLintReports')
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'io.github.libxposed:api:102.0.0'
}
