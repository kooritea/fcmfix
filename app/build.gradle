plugins {
    id 'com.android.application'
}

android {
    namespace = 'sumicya.fcmself'
    compileSdk = 37

    defaultConfig {
        applicationId = "sumicya.fcmself"
        minSdk = 29
        targetSdk = 37
        versionCode = 55
        versionName = "1.0.0-fcmself"
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    lint {
        checkReleaseBuilds = true
        abortOnError = true
        textReport = true
        def githubSummary = System.getenv('GITHUB_STEP_SUMMARY')
        if (githubSummary) {
            textOutput = file(githubSummary)
        }
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    // Android/JUnit annotations are consumed by their runtimes rather than javac processors.
    options.compilerArgs += ['-Xlint:all,-processing', '-Werror']
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'io.github.libxposed:api:102.0.0'
}
