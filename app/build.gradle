plugins {
    id 'com.android.application'
}

android {
    namespace = 'sumicya.fcmself'
    compileSdk = 37

    defaultConfig {
        applicationId = "sumicya.fcmself"
        minSdk = 29
        targetSdk = 37
        versionCode = 55
        versionName = "1.0.0-fcmself"
        // Only keep translations we actually ship; appcompat/material pull many languages.
        // AGP 9 prefers androidResources.localeFilters but resConfigs still works and is clearer
        // for Groovy. Keep en + zh variants to cover the app and its dependencies.
        resConfigs "en", "zh", "zh-rCN"
        vectorDrawables {
            useSupportLibrary = true
        }
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            // Re-compress PNGs after shrinking; marginal but free for release.
            crunchPngs = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    lint {
        checkReleaseBuilds = true
        abortOnError = true
        textReport = true
        xmlReport = true
        warningsAsErrors = true
    }

    androidResources {
        // AGP 8+ 严格模式：与 shrinkResources 配合，剔除 material/appcompat 带入的无用替代资源
        enableOptimizedResourceShrinking = true
    }

    packaging {
        resources {
            excludes += [
                "META-INF/DEPENDENCIES",
                "META-INF/LICENSE",
                "META-INF/LICENSE.txt",
                "META-INF/NOTICE",
                "META-INF/NOTICE.txt",
                "META-INF/*.kotlin_module",
                "kotlin/**"
            ]
        }
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    // Android/JUnit annotations are runtime-consumed; AGP also owns compiler paths/options.
    // Keep all actionable source diagnostics visible while excluding toolchain-only notices.
    options.compilerArgs += ['-Xlint:all,-processing,-options,-path']
}

// Surface lint findings as GitHub annotations even when warningsAsErrors fails the lint task.
def lintBuildPath = layout.buildDirectory.get().asFile.absolutePath
tasks.register('annotateLintReports') {
    doLast {
        new File(lintBuildPath).eachFileRecurse { report ->
            if (!report.name.startsWith('lint-results') || !report.name.endsWith('.xml')) {
                return
            }
            new groovy.xml.XmlSlurper(false, false).parse(report).issue.each { issue ->
                def location = issue.location[0]
                def message = String.valueOf(issue.@message)
                        .replace('%', '%25')
                        .replace('\r', '%0D')
                        .replace('\n', '%0A')
                println "::error file=${location.@file},line=${location.@line},col=${location.@column},title=Android Lint ${issue.@id}::${message}"
            }
        }
    }
}
tasks.matching { it.name == 'lint' || it.name == 'lintDebug' || it.name == 'lintRelease' }.configureEach {
    finalizedBy('annotateLintReports')
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'io.github.libxposed:api:102.0.0'
}
