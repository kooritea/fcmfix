plugins {
    id 'com.android.application'
    // Kotlin compilation and the matching Compose compiler are built into AGP 9.
}

android {
    namespace = 'sumicya.fcmself'
    compileSdk = 37

    defaultConfig {
        applicationId = "sumicya.fcmself"
        minSdk = 29
        targetSdk = 37
        versionCode = 56
        versionName = "1.1.0-fcmself"
    }

    buildFeatures {
        compose = true
    }

    buildTypes {
        release {
            minifyEnabled = true
            shrinkResources = true
            proguardFiles(getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro')
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    kotlin {
        compilerOptions {
            jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
        }
    }

    lint {
        checkReleaseBuilds = true
        abortOnError = true
        textReport = true
        xmlReport = true
        warningsAsErrors = true
    }
}

tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
    options.compilerArgs += ['-Xlint:all,-processing,-options,-path']
}

def lintBuildPath = layout.buildDirectory.get().asFile.absolutePath
tasks.register('annotateLintReports') {
    doLast {
        new File(lintBuildPath).eachFileRecurse { report ->
            if (!report.name.startsWith('lint-results') || !report.name.endsWith('.xml')) {
                return
            }
            new groovy.xml.XmlSlurper(false, false).parse(report).issue.each { issue ->
                def location = issue.location[0]
                def message = String.valueOf(issue.@message)
                        .replace('%', '%25')
                        .replace('\r', '%0D')
                        .replace('\n', '%0A')
                println "::error file=${location.@file},line=${location.@line},col=${location.@column},title=Android Lint ${issue.@id}::${message}"
            }
        }
    }
}
tasks.matching { it.name == 'lint' || it.name == 'lintDebug' || it.name == 'lintRelease' }.configureEach {
    finalizedBy('annotateLintReports')
}

dependencies {
    compileOnly 'io.github.libxposed:api:102.0.0'
    implementation 'io.github.libxposed:interface:102.0.0'
    implementation 'io.github.libxposed:service:102.0.0'

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'com.google.android.material:material:1.14.0'

    // Jetpack Compose BOM
    implementation platform('androidx.compose:compose-bom:2024.12.01')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.runtime:runtime'
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-runtime-compose:2.8.7'
    implementation 'androidx.navigation:navigation-compose:2.8.5'
    implementation 'androidx.core:core-ktx:1.15.0'

    debugImplementation 'androidx.compose.ui:ui-tooling'

    testImplementation 'junit:junit:4.13.2'
    testRuntimeOnly 'io.github.libxposed:api:102.0.0'
}