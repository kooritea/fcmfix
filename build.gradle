// Top-level build file
plugins {
    id 'com.android.application' version '9.3.0' apply false
    // AGP 9 has built-in Kotlin support; org.jetbrains.kotlin.android must NOT be applied.
    id 'org.jetbrains.kotlin.plugin.compose' version '2.2.20' apply false
}

// ── CI compile-error annotations ───────────────────────────────────────────
// The GitHub App used by this repository has no `workflows` permission, so the
// workflow file cannot be edited. Compile failures are therefore surfaced as
// GitHub Actions check-run annotations straight from Gradle: the build console
// is captured and error lines are re-emitted as ::error workflow commands when
// the build fails. Outside CI this block does nothing.
if (System.getenv('CI') != null) {
    def captured = java.util.Collections.synchronizedList(new ArrayList<String>())

    def sink = { CharSequence output ->
        captured.add(output.toString())
    }

    // Attach to the global output router: worker-compiled diagnostics (Kotlin,
    // javac) can bypass per-project logging managers.
    try {
        def internal = gradle.services.get(
                Class.forName('org.gradle.internal.logging.LoggingManagerInternal'))
        internal.addStandardOutputListener(
                sink as org.gradle.api.logging.StandardOutputListener)
        internal.addStandardErrorListener(
                sink as org.gradle.api.logging.StandardOutputListener)
    } catch (Throwable ignored) {
        // Fall back to per-project logging managers below.
    }

    gradle.projectsEvaluated {
        rootProject.allprojects { p ->
            def listener = sink as org.gradle.api.logging.StandardOutputListener
            // Kotlin/Javac diagnostics are logged at ERROR level, which the
            // console renders on the standard-error stream.
            p.logging.addStandardOutputListener(listener)
            p.logging.addStandardErrorListener(listener)
        }
    }

    gradle.buildFinished { result ->
        def emitted = []
        def seen = new HashSet<String>()

        def workspace = System.getenv('GITHUB_WORKSPACE')
        def rel = { String path ->
            if (workspace != null && path.startsWith(workspace)) {
                return path.substring(workspace.length() + 1)
            }
            int idx = path.lastIndexOf('/fcmself/')
            return idx >= 0 ? path.substring(idx + '/fcmself/'.length()) : path
        }
        def esc = { String text ->
            text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
        }
        def emit = { String title, String file, String line, String msg ->
            if (emitted.size() >= 50) {
                return
            }
            String key = "${title}|${file}|${line}|${msg}"
            if (seen.add(key)) {
                emitted.add(file.isEmpty()
                        ? "::error title=${title}::${esc(msg)}"
                        : "::error file=${file},line=${line},title=${title}::${esc(msg)}")
            }
        }

        synchronized (captured) {
            captured.each { raw ->
                raw.toString().eachLine { line ->
                    def kotlin = line =~ /^e:\s+file:\/\/(.+?):(\d+):(\d+)\s*(.*)$/
                    if (kotlin.find()) {
                        emit('Kotlin compile', rel(kotlin.group(1)),
                                kotlin.group(2), kotlin.group(4).trim())
                        return
                    }
                    def kotlinRel = line =~ /^e:\s+(.+?\.kt):(\d+):(\d+)\s*(.*)$/
                    if (kotlinRel.find()) {
                        emit('Kotlin compile', rel(kotlinRel.group(1)),
                                kotlinRel.group(2), kotlinRel.group(4).trim())
                        return
                    }
                    def javac = line =~ /^(.*?\.java):(\d+):\s+error:\s*(.*)$/
                    if (javac.find()) {
                        emit('Java compile', rel(javac.group(1)),
                                javac.group(2), javac.group(3).trim())
                        return
                    }
                    def aapt = line =~ /^(.*?\.xml):(\d+):\d+(?:-\d+)?:\s+AAPT: error:\s*(.*)$/
                    if (aapt.find()) {
                        emit('Resource link', rel(aapt.group(1)),
                                aapt.group(2), aapt.group(3).trim())
                        return
                    }
                    if (line.contains('Execution failed for task')) {
                        emit('Gradle task', '', '', line.trim())
                    }
                }
            }
        }

        if (result.failure != null) {
            // Include the nested cause chain so the annotation carries the
            // actual reason, not just the outermost "Build file ..." wrapper.
            def failureLines = []
            def walk
            walk = { Throwable t ->
                if (t == null || failureLines.size() >= 12) {
                    return
                }
                if (t.message != null) {
                    failureLines.addAll(t.message.readLines().take(6))
                }
                walk(t.cause)
            }
            walk(result.failure)
            if (emitted.isEmpty()) {
                emit('Build failure', '', '', failureLines.join(' | '))
            }
            // Dump captured lines that look like diagnostics but did not match
            // a file pattern (e.g. messages rendered on the error stream), so
            // no failure ships without a reason.
            def interesting = []
            synchronized (captured) {
                captured.each { raw ->
                    raw.toString().eachLine { line ->
                        def lower = line.toLowerCase()
                        if ((lower.contains('error') || lower.contains('unresolved')
                                || lower.contains('exception') || line.contains('e: '))
                                && interesting.size() < 12) {
                            interesting.add(line.trim())
                        }
                    }
                }
            }
            if (!interesting.isEmpty()) {
                emit('Build diagnostics', '', '', interesting.join(' | '))
            }
        }
        emitted.each { println(it) }
    }
}
